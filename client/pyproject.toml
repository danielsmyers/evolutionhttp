[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evolutionhttp"
version = "0.1.0"
authors = [
  { name = "Daniel Myers", email = "danielsmyers@gmail.com" },
]
description = "An HTTP client for controlling a Bryant Evolution HVAC system"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    # The HTTP client has always needed this; it was simply never declared.
    "aiohttp",
    # Imported directly for the 8N1 constants.
    "pyserial>=3.5",
    # The asyncio wrapper Home Assistant ships, rather than the barely
    # maintained pyserial-asyncio it forked from.
    "pyserial-asyncio-fast>=0.13",
]

[project.urls]
Homepage = "https://github.com/danielsmyers/evolutionhttp"
Issues = "https://github.com/danielsmyers/evolutionhttp/issues"
